name: verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The same Godot version the toolchain pins (docs/toolchain.md). The CI
      # Godot and the local one must match, or the two disagree about the harness.
      - name: Install Godot (.NET)
        run: |
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          godot_bin=$(find "$HOME/godot" -type f -name 'Godot_v*' -print -quit)
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          "$godot_bin" --version

      - name: Verify
        run: ./verify.sh

  # The analysis gate: it reports on the pull request, and it fails with the
  # quality gate — `main` requires that check, so this decides the merge
  # (docs/adr/0010-sonar-analysis-as-a-gate.md). It is a second job rather than a
  # step in `verify` because the scanner rewrites the build's ruleset and relaxes
  # warnings-as-errors, which `./verify.sh` must not inherit: the local gate has to
  # stay the same command, offline, with no token.
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # SonarQube Cloud's free plan analyses pull requests and the default branch,
    # and nothing else: a push to a feature branch would ask for a branch analysis
    # it does not offer. A pull request opened from a fork carries no secret, so it
    # is skipped here rather than failed — `verify` still runs for it.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v7
        with:
          # New-code detection blames every line: a shallow clone leaves the
          # analysis without the history it reasons about.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:Domingax_oryndra \
            /o:domingax \
            /s:"$PWD/SonarQube.Analysis.xml" \
            /d:sonar.token="$SONAR_TOKEN"

          # Built without warnings-as-errors: the Sonar rules arrive as build
          # warnings, and a report that fails the build is a gate by another name.
          dotnet build oryndra.sln --no-incremental -p:TreatWarningsAsErrors=false

          # The same core tests the gate runs, asking coverlet for the coverage
          # report SonarQube.Analysis.xml points at. No token is needed for them.
          dotnet test tests/Oryndra.Core.Tests/Oryndra.Core.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
